<div class="se-auth-wrap">
  <div class="se-auth-card card shadow-lg border-0">
    <div class="card-body p-4 p-sm-5">
      <div class="text-center mb-4">
        <i class="bi bi-house-heart-fill fs-1 text-primary"></i>
        <h1 class="h4 mt-2 mb-0">StayEase</h1>
        <p class="text-muted small">Sign in to the property management console</p>
      </div>

      @if (error()) {
        <div class="alert alert-danger py-2">{{ error() }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" formControlName="email" autocomplete="username" />
          @if (form.get('email')?.invalid && form.get('email')?.touched) {
            <div class="text-danger small mt-1">Enter a valid email.</div>
          }
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" formControlName="password" autocomplete="current-password" />
          @if (form.get('password')?.invalid && form.get('password')?.touched) {
            <div class="text-danger small mt-1">Password is required.</div>
          }
        </div>
        <button type="submit" class="btn btn-primary w-100" [disabled]="loading()">
          @if (loading()) {<span class="spinner-border spinner-border-sm me-1"></span>}
          Sign in
        </button>
      </form>

      <p class="text-center text-muted small mt-4 mb-0">
        No account? <a routerLink="/register">Create one</a>
      </p>
    </div>
  </div>
</div>
