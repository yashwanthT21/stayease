<!-- Welcome banner -->
<div class="card border-0 shadow-sm mb-4 se-owner-hero">
  <div class="card-body text-white p-4">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
      <div>
        <h1 class="h3 mb-1">Owner workspace 🏠</h1>
        <p class="mb-0 opacity-75">Everything you need to run your properties — listings, availability, bookings, payouts and reviews.</p>
      </div>
      <div class="text-end">
        <span class="badge text-bg-light fs-6">Owner</span>
        <div class="small opacity-75 mt-1">{{ auth.user()?.email }}</div>
      </div>
    </div>
  </div>
</div>

<!-- Portfolio KPIs -->
<div class="row g-3 mb-4">
  <div class="col-6 col-lg-3"><app-stat-tile label="Properties" [value]="count()" icon="bi-houses" tone="primary" /></div>
  <div class="col-6 col-lg-3"><app-stat-tile label="Listed" [value]="count('LISTED')" icon="bi-check-circle" tone="success" /></div>
  <div class="col-6 col-lg-3"><app-stat-tile label="Unlisted" [value]="count('UNLISTED')" icon="bi-eye-slash" tone="secondary" /></div>
  <div class="col-6 col-lg-3"><app-stat-tile label="Maintenance" [value]="count('UNDER_MAINTENANCE')" icon="bi-tools" tone="warning" /></div>
</div>

<!-- Module hub -->
<div class="d-flex align-items-center justify-content-between mb-3">
  <h2 class="h5 mb-0">Your tools</h2>
  <span class="text-muted small">{{ modules.length }} modules</span>
</div>

<div class="row g-3">
  @for (m of modules; track m.path) {
    <div class="col-sm-6 col-xl-4">
      <a [routerLink]="m.path" class="text-decoration-none">
        <div class="card se-stat-card shadow-sm h-100 se-owner-tile">
          <div class="card-body d-flex align-items-start gap-3">
            <div class="rounded-3 d-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary flex-shrink-0" style="width: 52px; height: 52px">
              <i class="bi {{ m.icon }} fs-3"></i>
            </div>
            <div class="min-w-0">
              <div class="fw-semibold text-body mb-1">{{ m.title }}</div>
              <div class="text-muted small">{{ m.desc }}</div>
            </div>
          </div>
        </div>
      </a>
    </div>
  }
</div>
