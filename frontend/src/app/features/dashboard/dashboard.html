<!-- Hero -->
<div class="card border-0 shadow-sm mb-4" style="background: linear-gradient(135deg, #0d6efd, #6610f2)">
  <div class="card-body text-white p-4">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
      <div>
        <h1 class="h3 mb-1">Welcome back 👋</h1>
        <p class="mb-0 opacity-75">{{ blurb() }}</p>
      </div>
      <div class="text-end">
        <span class="badge text-bg-light fs-6">{{ auth.role() | labelize }}</span>
        <div class="small opacity-75 mt-1">{{ auth.user()?.email }}</div>
      </div>
    </div>
  </div>
</div>

<div class="d-flex align-items-center justify-content-between mb-3">
  <h2 class="h5 mb-0">Your modules</h2>
  <span class="text-muted small">{{ totalModules() }} available</span>
</div>

<!-- Grouped quick-access cards -->
@for (g of groups(); track g.group) {
  <div class="mb-4">
    <div class="text-uppercase text-muted small fw-semibold mb-2">{{ g.group }}</div>
    <div class="row g-3">
      @for (item of g.items; track item.key) {
        <div class="col-sm-6 col-lg-4 col-xl-3">
          <a [routerLink]="['/', item.key]" class="text-decoration-none">
            <div class="card se-stat-card shadow-sm h-100 cursor-pointer">
              <div class="card-body d-flex align-items-center gap-3">
                <div class="rounded-3 d-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary" style="width: 48px; height: 48px">
                  <i class="bi {{ item.icon }} fs-4"></i>
                </div>
                <div class="min-w-0">
                  <div class="fw-semibold text-body">{{ item.title }}</div>
                  <div class="text-muted small text-truncate">Manage {{ item.singular | lowercase }} records</div>
                </div>
              </div>
            </div>
          </a>
        </div>
      }
    </div>
  </div>
}
